spring.application.name=scoresound-api

# Base de datos H2 en memoria: se crea al arrancar y se borra al apagar
spring.datasource.url=jdbc:h2:mem:scoresound
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas a partir de las entities
spring.jpa.hibernate.ddl-auto=create-drop
