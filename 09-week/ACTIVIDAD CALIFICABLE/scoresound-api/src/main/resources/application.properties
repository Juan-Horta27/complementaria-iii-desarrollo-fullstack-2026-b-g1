spring.application.name=scoresound-api

# Base de datos H2 en modo archivo: se crea la primera vez y los datos
# quedan en la carpeta data/, asi que sobreviven al reinicio de la API.
# La ruta es relativa: hay que arrancar la API desde la carpeta del proyecto.
spring.datasource.url=jdbc:h2:file:./data/scoresound
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas la primera vez y las conserva en los arranques siguientes
spring.jpa.hibernate.ddl-auto=update
